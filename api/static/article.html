<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/img/apple-touch-icon.png?v=3" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v=3" />
  <title data-i18n-title="article.title">文章 · 杭州波动粒子 Hangzhou Wave Particle</title>
  <link rel="stylesheet" href="/static/css/home.css?v=9" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/js/i18n.js?v=3"></script>
</head>
<body>

  <!-- 顶部导航 -->
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark">波</span>
        <span class="brand-text"><b data-i18n="brand.name">杭州波动粒子</b><span data-i18n="brand.sub">Hangzhou Wave Particle</span></span>
      </a>
      <nav class="nav-links">
        <a class="lnk" data-i18n="nav.culture" href="/">公司文化</a>
        <a class="lnk" data-i18n="nav.research" id="nav-research" href="/research">行业研究</a>
        <a class="lnk" data-i18n="nav.news" id="nav-news" href="/news">新闻浏览</a>
      </nav>
    </div>
  </header>

  <!-- 文章正文 -->
  <section class="block" id="article">
    <div class="block-inner">
      <div class="article-meta">
        <span class="news-date" id="art-date">—</span>
        <span class="news-tag" id="art-tags" style="margin-left:8px"></span>
      </div>
      <h1 class="article-h1" id="art-title" data-i18n="list.loading">加载中…</h1>
      <article class="md-body" id="art-body">
        <div class="loading-inline" data-i18n="list.loading">加载中…</div>
      </article>
      <div class="article-back">
        <a class="btn-hero solid" data-i18n="back.list" id="art-back" href="/research">← 返回列表</a>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-grid">
        <div>
          <h5 data-i18n="footer.capital">杭州波动粒子</h5>
          <p data-i18n="footer.desc">创造时间和知识的复利，一视同仁地为客户创造合理的、可持续的、超过社会平均的收益。</p>
        </div>
        <div>
          <h5 data-i18n="footer.nav">快捷导航</h5>
          <p><a href="/" data-i18n="footer.culture">公司文化</a></p>
          <p><a href="/research" data-i18n="footer.research">行业研究</a></p>
          <p><a href="/news" data-i18n="footer.news">新闻浏览</a></p>
        </div>
        <div>
          <h5 data-i18n="footer.contact">联系我们</h5>
          <p data-i18n="footer.email">邮箱：contact@qicifier.com</p>
          <p data-i18n="footer.tel">电话：+86 000 0000 0000</p>
          <p data-i18n="footer.addr">地址：中国 · 上海</p>
        </div>
      </div>
      <div class="footer-bottom">
        <span data-i18n="footer.rights">© 2026 杭州余杭波动粒子信息经营部 版权所有</span>
        <span class="filing"><svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#icon-globe"/></svg><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">浙ICP备2026077052号</a></span>
        <span class="filing"><img src="/static/img/gongan-beian.png" alt="公安备案" width="20" height="20" /><a href="https://beian.mps.gov.cn/#/query/webSearch?code=33011002020623" target="_blank" rel="noopener">浙公网安备33011002020623号</a></span>
        <span data-i18n="footer.disclaimer">本站内容仅供研究参考，不构成投资建议。</span>
      </div>
    </div>
  </footer>

  <script>
    /* 文章正文页词典 */
    if (window.I18N) {
      window.I18N.register({
        zh: {
          "article.title": "文章 · 杭州波动粒子 Hangzhou Wave Particle",
          "article.suffix": " · 杭州波动粒子 Hangzhou Wave Particle"
        },
        en: {
          "article.title": "Article · Hangzhou Wave Particle",
          "article.suffix": " · Hangzhou Wave Particle"
        }
      });
    }
    // 文章正文页: 从 API 读取文章详情 (标题/日期/标签/正文 markdown) 并渲染
    (function () {
      var aid = parseInt((location.pathname.match(/\/article\/(\d+)/) || [])[1] || "0", 10);
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      var t = function (k) { return window.I18N ? window.I18N.t(k) : ""; };
      var backHref = "/research";
      if (!aid) {
        document.getElementById("art-title").textContent = t("article.notfound");
        return;
      }
      var back = document.getElementById("art-back");
      var navResearch = document.getElementById("nav-research");
      var navNews = document.getElementById("nav-news");
      function setActiveNav() {
        if (back.dataset.kind === "news") {
          if (navNews) navNews.classList.add("active");
          if (navResearch) navResearch.classList.remove("active");
        } else {
          if (navResearch) navResearch.classList.add("active");
          if (navNews) navNews.classList.remove("active");
        }
      }
      // 渲染一篇文章 (format=html 的导入文章用 iframe 原样展示, 保留其自身样式与图表脚本)
      function paint(it) {
        var useEn = (window.I18N && window.I18N.getLang() === "en");
        var isHtml = String(it.format || "md") === "html";
        var showTitle = (useEn && it.title_en) ? it.title_en : it.title;
        var showBody = (useEn && it.body_en) ? it.body_en : it.body;
        var showDate = (useEn && it.date_en) ? it.date_en : it.date;
        var showTagsRaw = (useEn && it.tags_en) ? it.tags_en : (it.tags || "");
        document.title = (showTitle || "") + t("article.suffix");
        var titleEl = document.getElementById("art-title");
        titleEl.textContent = showTitle || "";
        titleEl.removeAttribute("data-i18n");   // 已加载真实标题, 不再受语言切换影响
        document.getElementById("art-date").textContent = showDate || "";
        var tags = [];
        try { tags = JSON.parse(showTagsRaw || "[]") || []; } catch (e) { tags = []; }
        document.getElementById("art-tags").textContent = tags.join(" · ");
        var bodyEl = document.getElementById("art-body");
        if (isHtml) {
          bodyEl.className = "md-body html-embed";
          bodyEl.innerHTML = '<iframe class="html-frame" title="' + esc(showTitle) +
            '" src="/article/' + aid + '/html" loading="lazy"></iframe>';
        } else {
          bodyEl.className = "md-body";
          bodyEl.innerHTML = marked.parse(showBody || "");
        }
        // 高亮对应导航 + 返回链接
        if (it.kind === "news") {
          back.dataset.kind = "news";
          back.href = "/news";
        } else {
          back.dataset.kind = "research";
          back.href = "/research";
        }
        backHref = back.href;
        setActiveNav();
      }
      fetch("/api/site/articles/" + aid)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("status " + r.status)); })
        .then(function (d) { paint(d.item); })
        .catch(function () {
          var errEl = document.getElementById("art-title");
          errEl.textContent = t("article.deleted");
          errEl.removeAttribute("data-i18n");
          document.getElementById("art-body").innerHTML = "";
        });
      if (window.I18N) {
        // 语言切换时重载文章正文 (标题/正文切换中英; HTML 导入文章正文不变)
        window.I18N.onApply = function () {
          fetch("/api/site/articles/" + aid)
            .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("status " + r.status)); })
            .then(function (d) { paint(d.item); })
            .catch(function () {});
        };
      }
    })();
  </script>

</body>
</html>
