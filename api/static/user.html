<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心</title>
  <link rel="stylesheet" href="/static/css/style.css?v=38" />
  <style>
    .user-page { max-width: 460px; margin: 24px auto; text-align: center; padding: 30px 24px; }
    .user-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; margin-bottom: 12px;
    }
    .user-page h2 { font-size: 22px; margin-bottom: 8px; word-break: break-all; }
    .user-meta { color: var(--text-soft); font-size: 13px; margin: 4px 0; }
    .user-actions { display: flex; gap: 12px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
    .user-actions .btn-ghost { display: inline-flex; align-items: center; }
  </style>
</head>
<body>
  <main class="container">
    <div class="card user-page" id="user-content">
      <p style="color:var(--text-soft)">加载中…</p>
    </div>

  <footer class="footer">
    <span>数据源 tushare · 仅供研究参考, 不构成投资建议</span>
  </footer>

  <script src="/static/js/auth.js?v=5"></script>

    /* 个人中心页: 未登录自动跳回首页 */
    CaiBaoAuth.initUserPage();
  </script>
</body>
</html>
