  <!-- 行业研究列表 -->
  <section class="block block-alt" id="research">
    <div class="block-inner">
      <div class="section-kicker">Research</div>
      <h2 class="section-title">行业研究</h2>
      <div class="article-list" id="research-list">
        <div class="loading-inline">加载中…</div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">

  <script>
    // 行业研究列表页: 从 API 读取文章列表 (标题/日期/标签), 点击进正文页
    (function () {
      var box = document.getElementById("research-list");
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function render(items) {
        if (!items || !items.length) {
          box.innerHTML = '<div class="loading-inline">暂无内容</div>';
          return;
        }
        box.innerHTML = items.map(function (it) {
          var tags = [];
          try { tags = JSON.parse(it.tags || "[]") || []; } catch (e) { tags = []; }
          var tagHtml = tags.map(function (t) {
            return '<span class="news-tag">' + esc(t) + "</span>";
          }).join("");
          return (
            '<a class="article-item" href="/article/' + it.id + '">' +
            '  <div class="article-head">' +
            '    <span class="news-date">' + esc(it.date || "") + "</span>" +
            '    <span class="article-title">' + esc(it.title) + "</span>" +
            tagHtml +
            "  </div>" +
            "</a>"
          );
        }).join("");
      }
      fetch("/api/site/articles?kind=research")
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("status " + r.status)); })
        .then(function (d) { render(d.items); })
        .catch(function () { box.innerHTML = '<div class="loading-inline">加载失败</div>'; });
    })();
  </script>

</body>
</html>
