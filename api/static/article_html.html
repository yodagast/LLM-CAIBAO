<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/img/apple-touch-icon.png?v=3" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v=3" />
  <title>{{PAGE_TITLE}}</title>
  <style>
    /*
     * 站点样式整体放进低优先级层 @layer site —— 报告自带的类名/标签可能与官网样式重名
     * (如 .hero / .wrap / .brand), 分层后容器内的隔离规则与报告自身样式 (均未分层) 恒优先。
     */
    @import url("/static/css/home.css?v=16") layer(site);
    /* 报告容器隔离: 先让容器内元素回退到浏览器默认值, 再由下面报告自身样式逐项覆盖 */
    .html-doc, .html-doc * { all: revert; }
    /* 容器宽度交给报告自身的 .wrap/.hero-inner, 宽表格横向滚动不撑破页面 */
    .html-doc { overflow-x: auto; }
    /* 报告自带样式 (服务端已加 .html-doc 作用域前缀, 不会外泄到站点头尾) */
    {{SCOPED_CSS}}
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark">Q</span>
        <span class="brand-text"><b>QICIFIER</b></span>
      </a>
      <nav class="nav-links">
        <a class="lnk" href="/">公司文化</a>
        <a class="lnk{{NAV_RESEARCH_ACTIVE}}" id="nav-research" href="/research">行业研究</a>
        <a class="lnk{{NAV_NEWS_ACTIVE}}" id="nav-news" href="/news">新闻浏览</a>
      </nav>
    </div>
  </header>

  <!-- 报告正文 (页面内嵌渲染, 不使用 iframe) -->
  <main>
    {{TITLE_BLOCK}}
    <div class="html-doc" id="art-body">{{CONTENT}}</div>
  </main>

  <!-- 报告底部: 返回列表 + 日期 / 标签 -->
  <div class="html-bar">
    <div class="html-bar-inner">
      <a class="html-back" href="{{BACK_HREF}}">{{BACK_LABEL}}</a>
      <span class="html-meta">
        <span class="news-date">{{DATE}}</span>{{TAGS_BLOCK}}
      </span>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-grid">
        <div>
          <h5>QICIFIER</h5>
          <p>创造时间和知识的复利，一视同仁地为客户创造合理的、可持续的、超过社会平均的收益。</p>
        </div>
        <div>
          <h5>快捷导航</h5>
          <p><a href="/">公司文化</a></p>
          <p><a href="/research">行业研究</a></p>
          <p><a href="/news">新闻浏览</a></p>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© 2026 杭州余杭波动粒子信息经营部 版权所有</span>
        <span class="filing"><svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#icon-globe"/></svg><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">浙ICP备2026077052号</a></span>
        <span class="filing"><img src="/static/img/gongan-beian.png" alt="公安备案" width="20" height="20" /><a href="https://beian.mps.gov.cn/#/query/webSearch?code=33011002020623" target="_blank" rel="noopener">浙公网安备33011002020623号</a></span>
        <span>本站内容仅供研究参考，不构成投资建议。</span>
      </div>
    </div>
  </footer>

  <!-- 报告自带脚本 (图表等, 原顺序执行) -->
  {{SCRIPTS}}

  <script>
    // 浏览器标题 = 报告标题 + 站点后缀 (由服务端渲染进 {{PAGE_TITLE}})
    document.title = {{TITLE_JSON}} + " · QICIFIER";
  </script>
</body>
</html>
