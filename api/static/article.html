<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/img/apple-touch-icon.png?v=3" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v=3" />
  <title>文章 · 杭州波动粒子</title>
  <link rel="stylesheet" href="/static/css/home.css?v=17" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- 顶部导航 -->
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark">Q</span>
        <span class="brand-text"><b>QICIFIER</b></span>
      </a>
      <nav class="nav-links">
        <a class="lnk" href="/">公司文化</a>
        <a class="lnk" id="nav-research" href="/research">行业研究</a>
        <a class="lnk" id="nav-news" href="/news">公司新闻</a>
      </nav>
    </div>
  </header>

  <!-- 文章正文 -->
  <section class="block" id="article">
    <div class="block-inner">
      <div class="article-meta">
        <span class="news-date" id="art-date">—</span>
        <span class="news-tag" id="art-tags" style="margin-left:8px"></span>
      </div>
      <h1 class="article-h1" id="art-title">加载中…</h1>
      <article class="md-body" id="art-body">
        <div class="loading-inline">加载中…</div>
      </article>
      <div class="article-back">
        <a class="btn-hero solid" id="art-back" href="/research">← 返回列表</a>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-grid">
        <div>
          <h5>QICIFIER</h5>
          <p>创造时间和知识的复利，一视同仁地为客户创造合理的、可持续的、超过社会平均的收益。</p>
        </div>
        <div>
          <h5>快捷导航</h5>
          <p><a href="/">公司文化</a></p>
          <p><a href="/research">行业研究</a></p>
          <p><a href="/news">公司新闻</a></p>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© 2026 杭州余杭波动粒子信息经营部 版权所有</span>
        <span class="filing"><svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#icon-globe"/></svg><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">浙ICP备2026077052号-3</a></span>
        <span class="filing"><img src="/static/img/gongan-beian.png" alt="公安备案" width="20" height="20" /><a href="https://beian.mps.gov.cn/#/query/webSearch?code=33011002020623" target="_blank" rel="noopener">浙公网安备33011002020623号</a></span>
        <span>本站内容仅供研究参考，不构成投资建议。</span>
      </div>
    </div>
  </footer>

  <script>
    // 文章正文页: 从 API 读取文章详情 (标题/日期/标签/正文 markdown) 并渲染
    (function () {
      var aid = parseInt((location.pathname.match(/\/article\/(\d+)/) || [])[1] || "0", 10);
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      if (!aid) {
        document.getElementById("art-title").textContent = "文章不存在";
        return;
      }
      var back = document.getElementById("art-back");
      var navResearch = document.getElementById("nav-research");
      var navNews = document.getElementById("nav-news");
      function setActiveNav() {
        if (back.dataset.kind === "news") {
          if (navNews) navNews.classList.add("active");
          if (navResearch) navResearch.classList.remove("active");
        } else {
          if (navResearch) navResearch.classList.add("active");
          if (navNews) navNews.classList.remove("active");
        }
      }
      // 渲染一篇文章 (format=html 的导入报告由服务端渲染成独立的站点外壳页)
      function paint(it) {
        document.title = (it.title || "文章") + " · 杭州波动粒子";
        document.getElementById("art-title").textContent = it.title || "";
        document.getElementById("art-date").textContent = it.date || "";
        var tags = [];
        try { tags = JSON.parse(it.tags || "[]") || []; } catch (e) { tags = []; }
        document.getElementById("art-tags").textContent = tags.join(" · ");
        document.getElementById("art-body").innerHTML = marked.parse(it.body || "");
        // 高亮对应导航 + 返回链接
        if (it.kind === "news") {
          back.dataset.kind = "news";
          back.href = "/news";
        } else {
          back.dataset.kind = "research";
          back.href = "/research";
        }
        setActiveNav();
      }
      fetch("/api/site/articles/" + aid)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("status " + r.status)); })
        .then(function (d) { paint(d.item); })
        .catch(function () {
          var errEl = document.getElementById("art-title");
          errEl.textContent = "文章不存在或已删除";
          document.getElementById("art-body").innerHTML = "";
        });
    })();
  </script>

</body>
</html>
